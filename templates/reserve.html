{% extends "base.html" %}
{% block title %}Reserve Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h3 class="fw-bold mb-2"><i class="bi bi-bookmark-plus me-2"></i>Reserve a Book</h3>
      <p class="text-muted mb-4">
        You can only reserve books with <strong>no available copies</strong>.
        When a copy is returned, you'll be next in line (held for 7 days).
      </p>

      <form method="POST" action="{{ url_for('reserve') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Book ISBN <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
            <input type="text" name="isbn" class="form-control form-control-lg"
                   placeholder="Enter ISBN of book to reserve"
                   required autofocus autocomplete="off">
          </div>
          <div class="form-text">Use the <a href="{{ url_for('search') }}">Search Catalogue</a> to find the ISBN.</div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-lis-primary btn-lg">
            <i class="bi bi-bookmark-check me-2"></i>Place Reservation
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
